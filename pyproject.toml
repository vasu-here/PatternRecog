[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "patternrecog-text-classifier"
version = "1.0.0"
description = "Explainable bag-of-words experiments for the 20 Newsgroups dataset"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.24",
  "scipy>=1.10",
  "scikit-learn>=1.3",
  "matplotlib>=3.7",
]

[project.scripts]
patternrecog = "patternrecog.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
